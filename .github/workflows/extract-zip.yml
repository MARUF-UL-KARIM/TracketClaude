name: Extract Project ZIP Parts

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract ZIP Files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=( *.zip )

          if (( ${#zips[@]} == 0 )); then
            echo "No ZIP files found!"
            exit 1
          fi

          for file in "${zips[@]}"; do
            echo "Extracting: $file"

            unzip -t "$file"
            unzip -o "$file" -d .

            rm -- "$file"
          done

      - name: Commit Extracted Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract project ZIP files"
            git push
          fi
